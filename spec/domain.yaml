enums:
  MembershipRole:
    - owner
    - admin
    - reviewer
    - viewer
  CampaignStatus:
    - draft
    - active
    - paused
    - completed
    - archived
  RunStatus:
    - pending
    - running
    - succeeded
    - failed
    - cancelled
  LeadStatus:
    - pending
    - accepted
    - rejected
    - suppressed
    - exported
  ReviewDecision:
    - accepted
    - rejected
    - needs_review
  ExportStatus:
    - pending
    - processing
    - completed
    - failed
  OutcomeType:
    - contacted
    - responded
    - qualified
    - converted
    - uninterested
    - bounced
  CrawlStatus:
    - pending
    - running
    - succeeded
    - failed
    - rate_limited
  SourceType:
    - greenhouse
    - lever
    - ashby
    - company_web
    - search

  IntentLabel:
    - buyer_request
    - company_hiring
    - operational_pain
    - growth_trigger
    - company_existence_only
    - seller_promotion
    - job_seeker
    - general_discussion
    - unresolved

  ContactRouteType:
    - generic_email
    - contact_form
    - sales_form
    - demo_booking
    - business_phone
    - support_route
    - named_work_email_approved
    - social_profile_review_only
    - named_contact

base_event_fields:
  - name: schema_version
    type: str
    default: "'1.0.0'"
  - name: event_id
    type: uuid
  - name: occurred_at
    type: datetime
  - name: workspace_id
    type: uuid
  - name: correlation_id
    type: uuid
  - name: producer
    type: str

events:
  discovery:
    description: Initial discovery request for a seed.
    fields:
      - name: seed_url
        type: url
      - name: source_id
        type: str
      - name: campaign_id
        type: uuid
  company_candidate:
    description: Candidate company identified by a discovery adapter.
    fields:
      - name: company_name
        type: str
      - name: domain
        type: str
      - name: source_payload
        type: json
  company_resolved:
    description: Company identity resolved and normalized.
    fields:
      - name: company_id
        type: uuid
      - name: canonical_name
        type: str
      - name: aliases
        type: list_str
  ats_board:
    description: Parsed ATS board snapshot.
    fields:
      - name: board_url
        type: url
      - name: provider
        type: enum:SourceType
      - name: board_token
        type: str
  job_signal:
    description: Normalized job posting signal.
    fields:
      - name: ats_board_id
        type: uuid
      - name: job_id
        type: str
      - name: title
        type: str
      - name: location
        type: str
      - name: description_text
        type: text
      - name: remote_allowed
        type: bool
  crawl_request:
    description: Request to crawl a single URL.
    fields:
      - name: url
        type: url
      - name: crawl_depth
        type: int
        default: 0
      - name: browser_allowed
        type: bool
        default: false
  crawl_result:
    description: Result of a crawl.
    fields:
      - name: crawl_request
        type: json
      - name: status
        type: enum:CrawlStatus
      - name: content_text
        type: text
      - name: links
        type: list_str
  page_snapshot_metadata:
    description: Metadata for a stored page snapshot.
    fields:
      - name: url
        type: url
      - name: snapshot_path
        type: str
      - name: etag
        type: str
      - name: fetched_at
        type: datetime
  evidence_record:
    description: Normalized evidence supporting a lead.
    fields:
      - name: company_id
        type: uuid
      - name: evidence_type
        type: str
      - name: source_event_id
        type: uuid
      - name: signal_strength
        type: float
  feature_vector:
    description: Extracted features for scoring.
    fields:
      - name: company_id
        type: uuid
      - name: features
        type: json
  classifier_input:
    description: Input to the classifier.
    fields:
      - name: company_id
        type: uuid
      - name: evidence_ids
        type: list_str
  classifier_output:
    description: Output from the classifier.
    fields:
      - name: company_id
        type: uuid
      - name: predicted_capabilities
        type: list_str
      - name: confidence
        type: float
  review_decision:
    description: Human review decision on a lead.
    fields:
      - name: lead_id
        type: uuid
      - name: decision
        type: enum:ReviewDecision
      - name: reviewer_id
        type: uuid
  export_request:
    description: Request to export leads.
    fields:
      - name: lead_ids
        type: list_str
      - name: destination
        type: str
  outcome_event:
    description: Outcome from outreach.
    fields:
      - name: lead_id
        type: uuid
      - name: outcome_type
        type: enum:OutcomeType
      - name: occurred_at
        type: datetime

