version: "1.0.0"
project: "VA Lead Intelligence"
requirements:
  - id: RQ-001
    title: Multi-tenant workspace authorization
    criteria:
      - API requests carry workspace ID and API key
      - All data queries filter by workspace_id
    tests:
      - test_unauthorized_request
      - test_create_company_requires_workspace
      - test_workspace_isolation
  - id: RQ-002
    title: Capability-driven lead scoring
    criteria:
      - Scorecard configuration drives scoring
      - Scores are deterministic and reproducible
    tests:
      - test_high_fit_passes
      - test_low_fit_fails
      - test_score_determinism
      - test_benchmark
  - id: RQ-003
    title: Source and jurisdiction compliance
    criteria:
      - Source policies allow/block sources per workspace
      - Jurisdiction policies block prohibited countries
    tests:
      - test_source_policy
      - test_jurisdiction_policy
  - id: RQ-004
    title: Event sourcing and audit trail
    criteria:
      - Mutations append audit_event records
      - Domain events carry correlation IDs
    tests:
      - test_audit_event
  - id: RQ-005
    title: Automated contract generation
    criteria:
      - OpenAPI and JSON Schemas are generated from code
      - Generated artifacts match committed files
    tests:
      - test_openapi_export
      - test_json_schema_export
      - test_erd_render
  - id: RQ-006
    title: Database migrations are versioned and testable
    criteria:
      - Alembic migrations cover all models
      - Migrations upgrade and downgrade cleanly
    tests:
      - test_migration_is_at_head
      - test_migration_file_exists
      - test_migration_downgrade
  - id: RQ-007
    title: Infrastructure as code
    criteria:
      - Terraform modules are validated and formatted
      - Environment catalogue is up to date
    tests:
      - test_terraform_validate
      - test_env_catalogue
  - id: RQ-008
    title: Operational runbooks and ADRs are current
    criteria:
      - All required ADRs are accepted
      - Runbooks cover incident response and rollback
    tests:
      - test_adrs_accepted
      - test_runbooks_exist
